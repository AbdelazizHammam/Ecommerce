<section class=" bg-gray-100   py-22">
  <div class="container grid w-3/4 mx-auto sm:grid-cols-12   items-start gap-10">

    <div class="col-span-12  rounded-lg shadow p-4">
      <div class="flex items-center  space-x-4 my-4">
        <h1 class="text-4xl ">Wish List Items</h1>
      <span class="text-red-700 font-bold"> {{whislistItems.data?.length}} Items</span>

      </div>
      @for (item of whislistItems.data; track  item._id) {
        <div class="bg-white p-2 rounded shadow space-x-2 my-3 grid sm:grid-cols-12">
        <div class="col-span-3">
          <img [src]="item.imageCover" class="w-full" [alt]="item.title">
        </div>
        <div class="col-span-9   flex items-center justify-between">
          <div>
            <h3 class="text-3xl mb-4"> {{item.title}} </h3>
            <div class="mb-3">
              <i class="fas fa-star text-yellow-300"></i>
              <span class="mb-3"> {{item.ratingsAverage}} </span>


            </div>
             <span> <span class="text-red-500 font-semibold">{{item.price }}</span> EGP</span>

          </div>
          <div class="btns">
            <button (click)="addToCart(item._id)" class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-[170px]  hover:bg-green-900  transtion-all duration-300  cursor-pointer mb-6" > <i class="fas fa-plus"></i> Add To Cart</button>
            <button (click)="removeItem(item._id)"  class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-red-500 grouphover px-6 py-2 rounded border text-white my-1 block w-[170px]  hover:bg-green-900  transtion-all duration-300  cursor-pointer " > <i class="fas fa-trash-can"></i> Remove</button>
          </div>
        </div>

      </div>
      }



    </div>


  </div>
</section>
