<section class="bg-gray-200 py-22">
  <div class="container grid sm:grid-cols-12  items-start gap-10">

    <div class="col-span-8  rounded-lg shadow p-4">
      <div class="flex items-center space-x-4 my-4">
        <h1 class="text-3xl">Cart</h1>
      <span class="text-red-700 font-bold"> {{cartDetails.products?.length}} Items</span>

      </div>
      @for (item of cartDetails.products; track item.product._id) {
        <div class="bg-white p-2 rounded shadow space-x-3 my-3 grid sm:grid-cols-12">
        <div class="col-span-1">
          <img [src]="item.product.imageCover" class="w-full" [alt]="item.product.title">
        </div>
        <div class="col-span-11 flex items-center justify-between">
          <div>
            <h3> {{item.product.title.split(' ',2).join(' ') }} </h3>
            <div class="flex items-center space-x-7 my-4 ">
              <div class=" border rounded-lg flex items-center space-x-12 py-1 px-2">
              <button  (click)="updateCount(item.product._id ,item.count - 1)" class="cursor-pointer rounded-full bg-white text-red-500 w-10  border border-red-500 hover:bg-red-500 hover:text-white"><i class="fas fa-minus"></i> </button>
              <span> {{item.count}}</span>
              <button (click)="updateCount(item.product._id ,item.count + 1)" class="cursor-pointer rounded-full bg-white text-green-500  w-10 border border-green-500 hover:bg-green-500 hover:text-white "><i class="fas fa-plus"></i> </button>
            </div>
            <button (click)="removeItem(item.product._id)" class="cursor-pointer rounded-full bg-white text-red-500  border border-red-500 hover:bg-red-500 hover:text-white w-10" ><i class="fas fa-trash-can"></i></button>
            </div>
          </div>
          <span> {{item.price * item.count}} EGP</span>
        </div>

      </div>
      }



    </div>
    <div class="col-span-4 bg-white p-4 rounded-lg shadow">
      <h2 class="text-3xl my-2">Order Summary</h2>
      <div class="flex items-center justify-between">
        <h3>Price</h3>
        <h4> {{cartDetails.totalCartPrice}} EGP </h4>
      </div>
      <button  [routerLink]="['/checkout' , cartDetails._id]" class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full hover:bg-green-900  transtion-all duration-300 cursor-pointer">Proceed To Checkout</button>
      <button (click)="clearCart()" class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-red-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full hover:bg-red-900  transtion-all duration-300 cursor-pointer">Clear Cart</button>
    </div>

  </div>
</section>
