<section class=" py-22 border-gray-400">
  <div class="container">
    <h2 class="text-4xl text-green-500 font-semibold text-center">Product List</h2>
    <input [(ngModel)]="text" type="search" class="w-1/2 mx-auto m-10 block rounded-xl border border-green-600 focus:border-green-700 focus:ring-2 focus:ring-green-500 outline-none p-3 shadow-sm transition duration-300">
    <div class="parent mt-10 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5  gap-4">


      @for (product of productList   | paginate: { id: 'foo',
                                                      itemsPerPage: pageSize,
                                                      currentPage: p,
                                                      totalItems: total }  |search:text; track product.id) {

        <app-card  [product]="product" />


      }

    </div>
  <div class="flex justify-center items-center mt-6">
      <pagination-controls class="my-pagination" id="foo"
                      (pageChange)="getAllData($event)"

                     >
</pagination-controls>
  </div>
  </div>

</section>
