<section class=" p-10 my-22 md:w-1/2 mx-auto shadow">
  <h1 class="text-4xl text-center my-3 ">CheckOut</h1>
  <form [formGroup]="checkOutForm" (ngSubmit)="submitForm()" >



    <app-input
    [element]=" 'text' "
     [control]="checkOutForm.get('shippingAddress')?.get('details')"
     [idInput]=" 'details' "
     [labelInput]=" 'Details' " >
    </app-input>
    <app-input
    [element]=" 'input' "
     [control]="checkOutForm.get('shippingAddress')?.get('phone')"
     [typeInput]=" 'tel' "
     [idInput]=" 'phone' "
     [labelInput]=" 'Phone' " >
     Accept only Egypt phone number
    </app-input>
    <app-input
    [element]=" 'input' "
     [control]="checkOutForm.get('shippingAddress')?.get('city')"
     [typeInput]=" 'text' "
     [idInput]=" 'text' "
     [labelInput]=" 'City' " >
    </app-input>

    <div class="buttons flex space-x-10">
      <button type="submit" (click)="setBtnType('visa')" class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-sky-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full hover:bg-green-900  transtion-all duration-300 cursor-pointer">Visa</button>
      <button type="submit" (click)="setBtnType('cash')" class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full hover:bg-green-900  transtion-all duration-300 cursor-pointer" >Cash</button>
    </div>



  </form>
</section>
