<section class="my-22 p-10 md:w-1/2 mx-auto ">
  <div class="container">


<ol class="flex items-center w-full text-sm font-medium text-center text-gray-500 dark:text-gray-400 sm:text-base my-2">
    <li  [class.text-blue-600]="step === 1"  class="flex md:w-full items-center  dark:text-blue-500 sm:after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
        <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
            <span class="me-2">1</span>
            Verify <span class="hidden sm:inline-flex sm:ms-2">Email</span>
        </span>
    </li>
    <li [class.text-blue-600]="step === 2" class="flex md:w-full items-center after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
        <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
            <span class="me-2">2</span>
            Verify <span class="hidden sm:inline-flex sm:ms-2">Code</span>
        </span>
    </li>
    <li [class.text-blue-600]="step === 3"  class="flex items-center">
        <span class="me-2">3</span>
        ResetPassword
    </li>
</ol>






  @if (step === 1) {
     <form [formGroup]="verifyEmail" (ngSubmit)="formStep1()" >

      <app-input
       [control]="verifyEmail.get('email') "
        [idInput]=" 'email' "
        [labelInput]=" 'Email' "
         [typeInput]=" 'email' "
          ></app-input>
          <button class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full mx-auto  hover:bg-green-900  transtion-all duration-300 cursor-pointer">Verify Email</button>

    </form>
  }
  @else if (step === 2) {
     <form [formGroup]="verifyCode"  (ngSubmit)=" formStep2() " >

      <app-input
       [control]="verifyCode.get('resetCode') "
        [idInput]=" 'resetCode' "
        [labelInput]=" 'ResetCode' "
         [typeInput]=" 'text' "
          ></app-input>
      <button class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full mx-auto  hover:bg-green-900  transtion-all duration-300 cursor-pointer">Reset Code</button>
    </form>
  }
    @else if (step === 3) {
        <form [formGroup]="resetPassword" (ngSubmit)="formStep3()"  >
       <app-input
       [control]="resetPassword.get('email') "
        [idInput]=" 'email' "
        [labelInput]=" 'Email' "
         [typeInput]=" 'email' "
          ></app-input>

      <app-input
       [control]="resetPassword.get('newPassword') "
        [idInput]=" 'newPassword' "
        [labelInput]=" 'NewPassword' "

          ></app-input>

          <button class="disabled:bg-gray-500 disabled:cursor-not-allowed bg-green-600 grouphover px-6 py-2 rounded border text-white my-1 block w-full mx-auto  hover:bg-green-900  transtion-all duration-300 cursor-pointer">Reset Password</button>

    </form>
    }




  </div>
</section>
